spring:
  application:
    name: bid-compliance-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bid_compliance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:user}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:./uploads}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    # How long to wait for the AI service before treating it as unavailable.
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:30}

compliance:
  # Configurable compliance-score weighting - must total 100.
  weights:
    gst: ${COMPLIANCE_WEIGHT_GST:15}
    pan: ${COMPLIANCE_WEIGHT_PAN:15}
    udyam: ${COMPLIANCE_WEIGHT_UDYAM:10}
    local-content: ${COMPLIANCE_WEIGHT_LOCAL_CONTENT:20}
    debarment: ${COMPLIANCE_WEIGHT_DEBARMENT:20}
    document-completeness: ${COMPLIANCE_WEIGHT_DOCUMENT_COMPLETENESS:10}
    cross-document-match: ${COMPLIANCE_WEIGHT_CROSS_DOCUMENT_MATCH:10}
  # Fuzzy company-name matching thresholds (percent similarity).
  name-match:
    pass-threshold: ${COMPLIANCE_NAME_MATCH_PASS:90}
    review-threshold: ${COMPLIANCE_NAME_MATCH_REVIEW:70}
  local-content:
    default-threshold-percent: ${LOCAL_CONTENT_DEFAULT_THRESHOLD:50}
